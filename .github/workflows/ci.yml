name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: equiptrack-solution branch/tag/SHA to check roles against
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Frontend checkout for the role-contract test (RoleContractTests).
      # If equiptrack-solution is private, add a repo secret FRONTEND_REPO_TOKEN
      # (fine-grained PAT with read access to that repo).
      # Branch: manual-run input > repo variable FRONTEND_REF > master.
      - uses: actions/checkout@v5
        with:
          repository: obafisayo/equiptrack-solution
          ref: ${{ inputs.frontend_ref || vars.FRONTEND_REF || 'master' }}
          path: _frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}
          sparse-checkout: src/lib/domain

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore EquipTrack.sln
      - run: dotnet build EquipTrack.sln --no-restore --configuration Release
      - run: dotnet test EquipTrack.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx"
        env:
          FRONTEND_REPO_PATH: ${{ github.workspace }}/_frontend
          REQUIRE_ROLE_CONTRACT: "true"

      - name: Check EF model has no pending migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/EquipTrack.Api --configuration Release --no-build
        env:
          ConnectionStrings__Default: Host=localhost

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
